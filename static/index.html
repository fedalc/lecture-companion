<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecture Companion</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="stylesheet" href="/static/common.css">
</head>
<body class="flex flex-col">
  <main class="max-w-4xl w-full mx-auto px-6 py-12">
    <h1 class="text-3xl font-semibold tracking-tight">Missed a class? Catch up, ask anything, find your gaps.</h1>
    <p class="mt-2 text-stone-500">Pick your course to see every class day, explained from your lecturer's own material.</p>
    <div id="courses" class="mt-8 grid sm:grid-cols-2 gap-4"></div>
  </main>
  <script src="/static/common.js"></script>
  <script>
    renderNav('student', [{ label: 'Courses' }]);
    (async () => {
      const box = document.getElementById('courses');
      const me = getCurrentUser();
      if (!me) { showUserPicker(); box.innerHTML = comingSoon('Choose who you are', 'pick yourself from the list'); return; }
      const teacher = me.role === 'teacher';
      if (teacher) document.querySelector('h1 + p').innerHTML = `Student view of your courses. Manage them on the <a href="/lecturer" class="text-indigo-600 hover:underline">dashboard</a>.`;
      const courses = await api(`/api/courses?${teacher ? 'teacher_id' : 'student_id'}=${me.id}`);
      if (!courses.length) {
        box.innerHTML = `<div class="sm:col-span-2 rounded-xl border border-dashed border-stone-300 bg-stone-50 p-6 text-center text-stone-500">
          <div class="font-medium text-stone-700">${teacher ? "You don't run any course yet" : `${escapeHtml(me.name)} isn't enrolled in any course yet`}</div>
          <div class="text-sm mt-1">${teacher ? 'Create one on the <a href="/lecturer" class="text-indigo-600 hover:underline">dashboard</a>.' : 'Enroll them on the <a href="/people" class="text-indigo-600 hover:underline">People</a> page.'}</div></div>`;
        return;
      }
      box.innerHTML = courses.map(c => `
        <a href="/course/${c.id}" class="block rounded-2xl bg-white border border-stone-200 p-5 hover:border-indigo-300 hover:shadow-sm transition">
          <div class="text-lg font-medium">${escapeHtml(c.name)}</div>
          <div class="text-sm text-stone-500 mt-1">${escapeHtml(c.lecturer_name || '')}</div>
        </a>`).join('');
    })();
  </script>
</body>
</html>
