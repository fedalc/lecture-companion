<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecturer · Lecture Companion</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="stylesheet" href="/static/common.css">
</head>
<!-- Phase 3 owns this page. Phase 0 version: tab shell + read-only class list. -->
<body class="flex flex-col">
  <main class="max-w-6xl w-full mx-auto px-6 py-8">
    <div class="flex items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">Lecturer dashboard</h1>
        <p class="text-stone-500">Upload material, run quizzes, and see where students get stuck.</p>
      </div>
      <select id="course-select" class="rounded-lg border border-stone-300 px-3 py-2 text-sm bg-white"></select>
    </div>

    <div class="mt-6 border-b border-stone-200 flex gap-6 text-sm" id="tabs">
      <button data-tab="class" class="pb-2 border-b-2 border-indigo-600 text-stone-900 font-medium">Class</button>
      <button data-tab="quizzes" class="pb-2 border-b-2 border-transparent text-stone-500">Quizzes</button>
      <button data-tab="insights" class="pb-2 border-b-2 border-transparent text-stone-500">Insights</button>
    </div>

    <section data-panel="class" class="mt-6 space-y-4">
      <div id="upload-slot"></div>
      <div id="class-list" class="space-y-3"></div>
    </section>
    <section data-panel="quizzes" class="mt-6 hidden"></section>
    <section data-panel="insights" class="mt-6 hidden"></section>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/lecturer.js"></script>
</body>
</html>
