<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course · Lecture Companion</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="stylesheet" href="/static/common.css">
</head>
<!-- Phase 2 owns this page (student course home). Phase 0 version: working list + self-eval entry point. -->
<body class="flex flex-col">
  <main class="max-w-5xl w-full mx-auto px-6 py-10">
    <h1 id="title" class="text-2xl font-semibold tracking-tight">…</h1>
    <p id="sub" class="text-stone-500"></p>
    <div class="mt-8 grid lg:grid-cols-3 gap-6">
      <section class="lg:col-span-2">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-stone-400 mb-3">Class days</h2>
        <div id="lectures" class="space-y-3"></div>
      </section>
      <aside>
        <div class="rounded-2xl bg-indigo-600 text-white p-6">
          <div class="text-sm uppercase tracking-wide text-indigo-200">Exam prep</div>
          <div class="text-xl font-semibold mt-1">Where do you stand?</div>
          <p class="text-indigo-100 text-sm mt-2">A short test across every class day. You'll see which lectures to review, with links.</p>
          <a id="selfeval" class="mt-4 inline-block bg-white text-indigo-700 font-medium px-4 py-2 rounded-lg hover:bg-indigo-50">Take self-evaluation test</a>
        </div>
        <h2 class="mt-8 text-sm font-semibold uppercase tracking-wide text-stone-400 mb-3">Homework</h2>
        <div id="homework" class="space-y-2"><div class="text-sm text-stone-400">Loading…</div></div>
      </aside>
    </div>
  </main>
  <script src="/static/common.js"></script>
  <script>
    (async () => {
      const cid = pathId();
      const [course, lectures] = await Promise.all([api(`/api/courses/${cid}`), api(`/api/courses/${cid}/lectures`)]);
      renderNav('student', [{ label: 'Courses', href: '/' }, { label: course.name }]);
      document.title = `${course.name} · Lecture Companion`;
      document.getElementById('title').textContent = course.name;
      document.getElementById('sub').textContent = course.lecturer_name || '';
      document.getElementById('selfeval').href = `/selfeval/${cid}`;
      const box = document.getElementById('lectures');
      box.innerHTML = lectures.length ? lectures.map(l => `
        <a href="/lecture/${l.id}" class="flex items-center gap-4 rounded-xl bg-white border border-stone-200 p-4 hover:border-indigo-300 hover:shadow-sm transition">
          <div class="w-10 h-10 rounded-lg bg-stone-100 grid place-items-center font-semibold text-stone-600">${l.number ?? ''}</div>
          <div class="min-w-0 flex-1">
            <div class="font-medium truncate">${escapeHtml(l.title)}</div>
            <div class="text-sm text-stone-500">${escapeHtml(l.date || '')}</div>
          </div>
          ${statusBadge(l.status)}
        </a>`).join('') : comingSoon('No class days yet', 'the lecturer uploads material');

      const hw = await api(`/api/courses/${cid}/open-quizzes?student_name=${encodeURIComponent(getStudentName(false) || '')}`).catch(() => []);
      document.getElementById('homework').innerHTML = hw.length ? hw.map(q => `
        <a href="/quiz/${q.id}" class="block rounded-xl bg-white border border-stone-200 p-3 hover:border-indigo-300 transition">
          <div class="flex items-center gap-2">
            <div class="font-medium text-sm truncate flex-1">${escapeHtml(q.title)}</div>
            ${q.best ? `<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">${q.best.score}/${q.best.total}</span>`
                     : `<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">to do</span>`}
          </div>
          <div class="text-xs text-stone-500 mt-0.5">${q.n_questions} questions${q.lecture_title ? ' · ' + escapeHtml(q.lecture_title) : ''}</div>
        </a>`).join('') : '<div class="text-sm text-stone-400">No open homework right now.</div>';
    })();
  </script>
</body>
</html>
