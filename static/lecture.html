<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class day · Lecture Companion</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="/static/common.css">
  <style>
    .tab-btn { color: #a8a29e; border-bottom: 2px solid transparent; text-transform: uppercase; }
    .tab-btn:hover { color: #57534e; }
    .tab-active { color: #4338ca; border-bottom-color: #4f46e5; }
    mark.note-mark { background: #fef3c7; border-bottom: 2px solid #f59e0b; padding: 0 1px; cursor: pointer; border-radius: 2px; }
    mark.note-mark.flash { background: #fde68a; transition: background .3s; }
    .msg-assistant ul, .msg-assistant ol { padding-left: 1.2rem; list-style: disc; }
    .slide-page { margin: 12px auto; max-width: 100%; background: white; box-shadow: 0 1px 5px #0002; }
    .topic-anchor { scroll-margin-top: 1rem; }
  </style>
</head>
<!-- Phase 1 owns this page: 3-panel layout, lecture + slides, tutor chat, highlight-to-ask, notes. -->
<body class="flex flex-col h-screen overflow-hidden">
  <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-2">
    <!-- LEFT: AI lecture -->
    <section class="min-h-0 flex flex-col border-r border-stone-200 bg-white">
      <div class="px-8 pt-6 pb-4 border-b border-stone-100">
        <div id="meta" class="text-xs uppercase tracking-wide text-stone-400"></div>
        <h1 id="title" class="text-2xl font-semibold tracking-tight mt-1">Loading…</h1>
        <div id="topics" class="flex flex-wrap gap-1.5 mt-3"></div>
      </div>
      <article id="lecture" class="panel-scroll flex-1 px-8 py-6">
        <div class="lecture-prose prose prose-stone prose-headings:tracking-tight"></div>
      </article>
    </section>

    <!-- RIGHT: slides on top, chat below -->
    <section class="min-h-0 grid grid-rows-2">
      <div class="min-h-0 flex flex-col border-b border-stone-200">
        <div class="h-9 shrink-0 px-4 flex items-center justify-between text-xs font-semibold uppercase tracking-wide text-stone-400 bg-stone-50 border-b border-stone-200">
          Slides <span class="normal-case font-normal text-stone-400">· topic sync</span><a id="slides-open" target="_blank" class="normal-case font-normal text-indigo-600 hover:underline">open PDF ↗</a>
        </div>
        <div id="slides-viewer" class="panel-scroll flex-1 w-full bg-stone-100 p-2" aria-label="Course slides"></div>
      </div>
      <div class="min-h-0 flex flex-col bg-white">
        <div class="h-9 shrink-0 px-2 flex items-stretch text-xs font-semibold uppercase tracking-wide bg-stone-50 border-b border-stone-200">
          <button data-tab="chat" class="tab-btn px-3 tab-active">Ask the tutor</button>
          <button data-tab="notes" class="tab-btn px-3">My notes <span id="notes-count" class="ml-1 rounded-full bg-stone-200 text-stone-600 px-1.5 normal-case">0</span></button>
          <span class="ml-auto self-center pr-2 normal-case font-normal text-stone-400 hidden xl:inline">answers come only from this class's material</span>
        </div>

        <!-- NOTES tab -->
        <div id="notes-pane" class="hidden min-h-0 flex-1 flex flex-col">
          <form id="note-form" class="hidden m-3 mb-0 rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm">
            <div id="note-quote" class="text-xs italic text-stone-600 border-l-4 border-amber-400 pl-2 mb-2 line-clamp-3"></div>
            <textarea id="note-input" rows="3" placeholder="Write your note…"
                      class="w-full rounded-md border border-stone-300 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-amber-400"></textarea>
            <div class="mt-2 flex justify-end gap-2">
              <button type="button" id="note-cancel" class="px-3 py-1 rounded-md text-stone-500 hover:text-stone-800">Cancel</button>
              <button class="px-3 py-1 rounded-md bg-amber-500 text-white font-medium hover:bg-amber-600">Save note</button>
            </div>
          </form>
          <div id="notes-list" class="panel-scroll flex-1 p-3 space-y-2 text-sm"></div>
        </div>

        <!-- CHAT tab -->
        <div id="chat-pane" class="min-h-0 flex-1 flex flex-col">
        <div id="messages" class="panel-scroll flex-1 p-4 space-y-3 text-sm"></div>
        <div id="quote" class="hidden mx-4 mb-2 text-xs border-l-4 border-indigo-400 bg-indigo-50 px-3 py-2 rounded-r flex gap-2">
          <span id="quote-text" class="flex-1 line-clamp-3 italic text-stone-600"></span>
          <button id="quote-clear" class="text-stone-400 hover:text-stone-700">✕</button>
        </div>
        <form id="chat-form" class="p-3 pt-0 flex gap-2">
          <input id="chat-input" autocomplete="off" placeholder="Ask about anything in this lecture…"
                 class="flex-1 rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button class="rounded-lg bg-indigo-600 text-white px-4 text-sm font-medium hover:bg-indigo-700 disabled:opacity-50">Send</button>
        </form>
        </div>
      </div>
    </section>
  </div>

  <!-- highlight popup -->
  <div id="sel-popup" class="rounded-lg bg-stone-900 text-white text-sm shadow-lg overflow-hidden">
    <button id="sel-ask" class="px-3 py-1.5 hover:bg-stone-700">Ask about this</button>
    <button id="sel-note" class="px-3 py-1.5 hover:bg-stone-700 border-l border-stone-700">Add note</button>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/lecture.js"></script>
</body>
</html>
